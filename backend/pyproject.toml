[project]
name = "llm-arena-backend"
version = "0.1.0"
description = "Backend of llm-arena: compare LLMs and prompts by quality, cost and latency."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.158,<0.159",
    "uvicorn[standard]>=0.54,<0.55",
    "anthropic>=2.0,<3",
    "openai>=3.36,<4",
    "httpx>=0.28,<0.29",  # OllamaAdapter talks to Ollama directly; also used by FastAPI's TestClient
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.12,<3",  # HTTP library of the anthropic/openai SDKs; tests use its fake transport
    "anyio>=4.10,<5",  # pytest plugin that runs our async tests
    "ruff>=0.17,<0.18",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, UP: modern syntax, B: likely bugs
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
